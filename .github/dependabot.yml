version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /bindings/node
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
