name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
          - os: macos-latest
            ext: dylib
    steps:
      - uses: actions/checkout@v7
      - name: Build loadable extension
        run: make loadable
      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/predict0.${{ matrix.ext }} \
            out/predict0-${{ runner.os }}-${{ runner.arch }}.${{ matrix.ext }}
      - uses: actions/upload-artifact@v7
        with:
          name: predict0-${{ runner.os }}-${{ runner.arch }}
          path: out/*

  windows:
    name: binary (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc make curl unzip
      - name: Build loadable DLL
        run: make loadable
      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/predict0.dll out/predict0-Windows-X64.dll
      - uses: actions/upload-artifact@v7
        with:
          name: predict0-Windows-X64
          path: out/*

  amalgamation:
    name: amalgamation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the single-file drop-in build, attached so users can grab one .c file
      - name: Generate + compile amalgamation
        run: make amalgamation-check
      - uses: actions/upload-artifact@v7
        with:
          name: amalgamation
          path: dist/sqlite-predict.c

  release:
    needs: [binaries, windows, amalgamation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: (cd artifacts && sha256sum * > SHA256SUMS)
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
