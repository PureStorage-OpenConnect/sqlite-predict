[package]
name = "sqlite-predict"
version = "0.0.1-alpha.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Prediction as a SQL primitive for SQLite: forecast, detect_anomalies, predict, with replayable receipts."
repository = "https://github.com/PureStorage-OpenConnect/sqlite-predict"
keywords = ["sqlite", "forecasting", "anomaly-detection", "time-series"]
categories = ["database", "science"]
include = ["src/**", "build.rs", "csrc/**", "README.md"]

[build-dependencies]
cc = "1"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
